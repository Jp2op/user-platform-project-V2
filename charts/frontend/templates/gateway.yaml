{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "frontend.fullname" . }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.gateway.certificateArn }}
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.gateway.certificateArn | quote }}
    {{- end }}
    {{- if .Values.gateway.wafAclArn }}
    alb.ingress.kubernetes.io/wafv2-acl-arn: {{ .Values.gateway.wafAclArn | quote }}
    {{- end }}
spec:
  gatewayClassName: alb

  # Reference LoadBalancerConfiguration so the ALB is internet-facing
  # and uses our public subnets instead of internal ones.
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: {{ include "frontend.fullname" . }}-lb

  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Same

    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
