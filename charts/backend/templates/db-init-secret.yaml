{{- if .Values.dbInit.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.dbInit.rootSecretRef }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  refreshInterval: 24h

  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  target:
    name: {{ .Values.dbInit.rootSecretRef }}
    creationPolicy: Owner

  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.dbInit.rootSecretName }}
        property: password
    - secretKey: host
      remoteRef:
        key: {{ .Values.dbInit.rootSecretName }}
        property: host
